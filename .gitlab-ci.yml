stages: [validate]

sync-check:
  stage: validate
  image: mcr.microsoft.com/powershell:latest
  script:
    - pwsh -NoProfile -File ./tools/sync.ps1 -Check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: validate
  image: mcr.microsoft.com/powershell:latest
  script:
    - pwsh -NoProfile -File ./tools/lint.ps1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

hook-tests:
  stage: validate
  image: mcr.microsoft.com/powershell:latest
  script:
    - pwsh -NoProfile -File ./tools/test-hooks.ps1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
